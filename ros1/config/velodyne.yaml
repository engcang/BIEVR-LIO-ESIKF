common:
    lidar_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"
    map_frame: "map"
    odometry_frame: "odom"

filter:
    maximum_iterations: 3

preprocess:
    lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
    scan_line_count: 32
    scan_rate_hz: 10                # only need to be set for velodyne, unit: Hz,
    point_stride: 4
    voxel_resolution: 0.1
    point_timestamp_unit: 2            # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
    min_range: 2.0

mapping:
    accelerometer_covariance: 0.1
    gyroscope_covariance: 0.1
    accelerometer_bias_covariance: 0.0001
    gyroscope_bias_covariance: 0.0001
    lidar_to_imu_translation: [ 0, 0, 0.28]
    lidar_to_imu_rotation: [ 1, 0, 0,
                             0, 1, 0,
                             0, 0, 1]

# Disabled runtime measurement does not call the clock or allocate per scan.
runtime:
    enabled: false
    output_path: "runtime.csv"

publish:
    path_en:  true
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: false # true: output the point cloud scans in IMU-body-frame

# BIEVR oriented height-image map and informed sampling settings.
bievr:
    voxel_size: 0.5
    pixel_size: 0.05
    normal_tolerance_degrees: 3.0
    smooth_image: true
    use_range_weight: true
    maximum_voxel_count: 1500000
    informed_sampling_enabled: true
    informed_voxel_count: 300
    huber_delta: 0.1
